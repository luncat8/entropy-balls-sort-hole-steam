<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Two-Player Hole Control</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			padding: 20px 0;
			display: grid;
			place-items: center;
			background: #111827;
			color: #e5e7eb;
			font-family: system-ui, sans-serif;
		}

		main {
			width: min(900px, 96vw);
		}

		.controls {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
			margin-bottom: 12px;
		}

		.player {
			padding: 12px;
			border: 1px solid #475569;
			border-radius: 8px;
			background: #1e293b;
		}

		.player h2 {
			margin: 0 0 8px;
			font-size: 1rem;
		}

		.task {
			min-height: 42px;
			margin: 0 0 8px;
			color: #e2e8f0;
			font-size: 0.9rem;
		}

		.energy-label {
			margin: 8px 0 4px;
			font-size: 0.85rem;
		}

		.energy {
			height: 10px;
			overflow: hidden;
			border-radius: 5px;
			background: #0f172a;
		}

		.energy-fill {
			width: 100%;
			height: 100%;
			background: #22c55e;
			transition: width 0.08s linear;
		}

		.force-label {
			display: flex;
			justify-content: space-between;
			margin: 10px 0 4px;
			font-size: 0.85rem;
		}

		input[type="range"] {
			width: 100%;
			accent-color: #38bdf8;
		}

		.hold-button {
			width: 100%;
			margin-top: 8px;
			padding: 10px;
			border: 0;
			border-radius: 6px;
			background: #2563eb;
			color: white;
			font: inherit;
			font-weight: 700;
			touch-action: none;
			user-select: none;
		}

		.hold-button:active,
		.hold-button.active {
			background: #dc2626;
		}

		.bot-option {
			display: flex;
			align-items: center;
			gap: 6px;
			margin-bottom: 8px;
			font-size: 0.9rem;
		}

		#instructions {
			margin: 0 0 10px;
			color: #cbd5e1;
			text-align: center;
			font-size: 0.9rem;
		}

		canvas {
			display: block;
			width: 100%;
			border: 2px solid #64748b;
			border-radius: 8px;
			background: #0f172a;
			touch-action: none;
		}

		@media (max-width: 600px) {
			.controls {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main>
		<div class="controls">
			<section class="player" id="player1">
				<h2>Player 1</h2>
				<p class="task" id="task1"></p>
				<div class="energy-label" id="energyLabel1">Energy: 100%</div>
				<div class="energy">
					<div class="energy-fill" id="energyFill1"></div>
				</div>
				<label class="force-label" for="force1">
					<span>Force</span>
					<span id="forceValue1">0</span>
				</label>
				<input id="force1" type="range" min="-100" max="100" value="0">
				<button class="hold-button" id="hold1">HOLD TO PUSH / PULL</button>
			</section>

			<section class="player" id="player2">
				<h2>Player 2</h2>
				<label class="bot-option">
					<input id="botCheckbox" type="checkbox">
					Bot player
				</label>
				<p class="task" id="task2"></p>
				<div class="energy-label" id="energyLabel2">Energy: 100%</div>
				<div class="energy">
					<div class="energy-fill" id="energyFill2"></div>
				</div>
				<label class="force-label" for="force2">
					<span>Force</span>
					<span id="forceValue2">0</span>
				</label>
				<input id="force2" type="range" min="-100" max="100" value="0">
				<button class="hold-button" id="hold2">HOLD TO PUSH / PULL</button>
			</section>
		</div>

		<p id="instructions">
			Hold a button to apply force. Use the mouse wheel over a player's controls to change force.
			Positive force moves the hole down; negative force moves it up. Press Space to add a ball.
		</p>

		<canvas id="game" aria-label="Two-player ball game with a force-controlled hole"></canvas>
	</main>

	<script>
		const canvas = document.querySelector("#game");
		const ctx = canvas.getContext("2d");

		const wallWidth = 8;
		const holeSize = 130;
		const ballRadius = 10;
		const maxEnergy = 100;
		const energyDrain = 28;
		const energyRecharge = 10;

		const balls = [];

		let width = 800;
		let height = 500;
		let holeY = height / 2;
		let holeVelocity = 0;
		let lastTime = 0;
		let botTime = 0;

		const players = [
			{
				side: "LEFT",
				taskElement: document.querySelector("#task1"),
				slider: document.querySelector("#force1"),
				forceValue: document.querySelector("#forceValue1"),
				energyFill: document.querySelector("#energyFill1"),
				energyLabel: document.querySelector("#energyLabel1"),
				button: document.querySelector("#hold1"),
				energy: maxEnergy,
				holding: false,
				task: null
			},
			{
				side: "RIGHT",
				taskElement: document.querySelector("#task2"),
				slider: document.querySelector("#force2"),
				forceValue: document.querySelector("#forceValue2"),
				energyFill: document.querySelector("#energyFill2"),
				energyLabel: document.querySelector("#energyLabel2"),
				button: document.querySelector("#hold2"),
				energy: maxEnergy,
				holding: false,
				task: null
			}
		];

		function resize() {
			const rect = canvas.getBoundingClientRect();
			const dpr = window.devicePixelRatio || 1;

			width = rect.width;
			height = width * 0.625;

			canvas.style.height = `${height}px`;
			canvas.width = Math.round(width * dpr);
			canvas.height = Math.round(height * dpr);
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

			holeY = Math.max(
				holeSize / 2 + 12,
				Math.min(height - holeSize / 2 - 12, holeY)
			);
		}

		function addBall(x = Math.random() * (width - 40) + 20, y = Math.random() * (height - 40) + 20) {
			const angle = Math.random() * Math.PI * 2;
			const speed = 130 + Math.random() * 100;
			const hue = Math.random() * 360;

			balls.push({
				x,
				y,
				vx: Math.cos(angle) * speed,
				vy: Math.sin(angle) * speed,
				hue,
				color: `hsl(${hue}, 85%, 65%)`
			});
		}

		function newTask(player) {
			const comparison = Math.random() < 0.5 ? ">" : "<";
			const percent = 30 + Math.floor(Math.random() * 41);
			const groupType = Math.floor(Math.random() * 3);

			if (groupType === 0) {
				player.task = { comparison, percent, type: "cold" };
				player.taskElement.textContent =
					`Task: Get ${comparison} ${percent}% COLD balls on the ${player.side}.`;
			} else if (groupType === 1) {
				player.task = { comparison, percent, type: "hot" };
				player.taskElement.textContent =
					`Task: Get ${comparison} ${percent}% HOT balls on the ${player.side}.`;
			} else {
				const hue = Math.floor(Math.random() * 360);
				player.task = { comparison, percent, type: "hue", hue };
				player.taskElement.textContent =
					`Task: Get ${comparison} ${percent}% balls near hue ${hue}° on the ${player.side}.`;
			}
		}

		function matchesTaskColor(ball, task) {
			if (task.type === "cold") {
				return ball.hue >= 160 && ball.hue <= 260;
			}

			if (task.type === "hot") {
				return ball.hue <= 60 || ball.hue >= 300;
			}

			const difference = Math.abs(ball.hue - task.hue);
			return Math.min(difference, 360 - difference) <= 25;
		}

		function checkTasks() {
			const middleX = width / 2;

			for (const player of players) {
				const sideBalls = balls.filter(ball =>
					player.side === "LEFT" ? ball.x < middleX : ball.x >= middleX
				);

				if (sideBalls.length === 0) {
					continue;
				}

				const matchingBalls = sideBalls.filter(ball =>
					matchesTaskColor(ball, player.task)
				);

				const percent = matchingBalls.length / sideBalls.length * 100;
				const task = player.task;

				const solved = task.comparison === ">"
					? percent > task.percent
					: percent < task.percent;

				if (solved) {
					newTask(player);
				}
			}
		}

		function setHolding(player, holding) {
			player.holding = holding;
			player.button.classList.toggle("active", holding);
		}

		function setupHoldButton(player) {
			player.button.addEventListener("pointerdown", event => {
				event.preventDefault();
				player.button.setPointerCapture(event.pointerId);
				setHolding(player, true);
			});

			player.button.addEventListener("pointerup", () => {
				setHolding(player, false);
			});

			player.button.addEventListener("pointercancel", () => {
				setHolding(player, false);
			});

			player.button.addEventListener("lostpointercapture", () => {
				setHolding(player, false);
			});
		}

		function updatePlayerUI(player) {
			const force = Number(player.slider.value);
			const energyPercent = player.energy / maxEnergy * 100;

			player.forceValue.textContent = force > 0 ? `+${force}` : `${force}`;
			player.energyFill.style.width = `${energyPercent}%`;
			player.energyLabel.textContent = `Energy: ${Math.round(energyPercent)}%`;

			if (energyPercent < 25) {
				player.energyFill.style.background = "#ef4444";
			} else if (energyPercent < 55) {
				player.energyFill.style.background = "#f59e0b";
			} else {
				player.energyFill.style.background = "#22c55e";
			}
		}

		function updateBot(dt) {
			const botEnabled = document.querySelector("#botCheckbox").checked;
			const botPlayer = players[1];

			if (!botEnabled) {
				botPlayer.holding = false;
				botPlayer.button.classList.remove("active");
				return;
			}

			botTime += dt;

			// The bot periodically pushes or pulls, while respecting its energy.
			if (botTime > 1.2) {
				botTime = 0;
				const direction = Math.random() < 0.5 ? -1 : 1;
				botPlayer.slider.value = direction * (45 + Math.floor(Math.random() * 56));
				botPlayer.holding = true;
			}

			if (botPlayer.energy < 15) {
				botPlayer.holding = false;
			} else if (botTime > 0.75) {
				botPlayer.holding = false;
			}

			botPlayer.button.classList.toggle("active", botPlayer.holding);
		}

		function update(dt) {
			updateBot(dt);

			let totalForce = 0;

			for (const player of players) {
				const force = Number(player.slider.value) / 100;

				if (player.holding && player.energy > 0) {
					totalForce += force;
					player.energy = Math.max(0, player.energy - Math.abs(force) * energyDrain * dt);
				} else {
					player.energy = Math.min(maxEnergy, player.energy + energyRecharge * dt);
				}

				updatePlayerUI(player);
			}

			// Applied force accelerates the hole; damping makes it gradually settle.
			holeVelocity += totalForce * 650 * dt;
			holeVelocity *= Math.pow(0.12, dt);
			holeY += holeVelocity * dt;

			const minHoleY = holeSize / 2 + 12;
			const maxHoleY = height - holeSize / 2 - 12;

			if (holeY < minHoleY) {
				holeY = minHoleY;
				holeVelocity = Math.max(0, holeVelocity);
			} else if (holeY > maxHoleY) {
				holeY = maxHoleY;
				holeVelocity = Math.min(0, holeVelocity);
			}

			const wallX = width / 2;

			for (const ball of balls) {
				const oldX = ball.x;

				ball.x += ball.vx * dt;
				ball.y += ball.vy * dt;

				if (ball.y < ballRadius) {
					ball.y = ballRadius;
					ball.vy = Math.abs(ball.vy);
				} else if (ball.y > height - ballRadius) {
					ball.y = height - ballRadius;
					ball.vy = -Math.abs(ball.vy);
				}

				if (ball.x < ballRadius) {
					ball.x = ballRadius;
					ball.vx = Math.abs(ball.vx);
				} else if (ball.x > width - ballRadius) {
					ball.x = width - ballRadius;
					ball.vx = -Math.abs(ball.vx);
				}

				const crossedWall =
					(oldX < wallX && ball.x >= wallX) ||
					(oldX > wallX && ball.x <= wallX);

				const insideHole = Math.abs(ball.y - holeY) < holeSize / 2 - ballRadius;

				if (crossedWall && !insideHole) {
					if (oldX < wallX) {
						ball.x = wallX - ballRadius - wallWidth / 2;
					} else {
						ball.x = wallX + ballRadius + wallWidth / 2;
					}

					ball.vx *= -1;
				}
			}

			checkTasks();
		}

		function drawTrajectory(ball) {
			const wallX = width / 2;
			const headingTowardWall = ball.vx > 0
				? ball.x < wallX
				: ball.x > wallX;

			if (!headingTowardWall) {
				return;
			}

			const timeToWall = (wallX - ball.x) / ball.vx;

			if (timeToWall <= 0) {
				return;
			}

			const minY = ballRadius;
			const maxY = height - ballRadius;
			const span = maxY - minY;
			const rawY = ball.y + ball.vy * timeToWall;
			const foldedY = ((rawY - minY) % (span * 2) + span * 2) % (span * 2);
			const hitY = minY + (foldedY <= span ? foldedY : span * 2 - foldedY);

			if (Math.abs(hitY - holeY) < holeSize / 2 - ballRadius) {
				return;
			}

			const direction = Math.sign(ball.vy);
			const firstBoundary = direction > 0 ? maxY : minY;
			const timeToBoundary = ball.vy === 0
				? Infinity
				: (firstBoundary - ball.y) / ball.vy;

			ctx.save();
			ctx.strokeStyle = ball.color;
			ctx.fillStyle = ball.color;
			ctx.lineWidth = 2;
			ctx.globalAlpha = 0.65;
			ctx.beginPath();
			ctx.moveTo(ball.x, ball.y);

			if (timeToBoundary > 0 && timeToBoundary < timeToWall) {
				const bounceX = ball.x + ball.vx * timeToBoundary;
				ctx.lineTo(bounceX, firstBoundary);
				ctx.lineTo(wallX, hitY);
			} else {
				ctx.lineTo(wallX, hitY);
			}

			ctx.stroke();
			ctx.globalAlpha = 1;
			ctx.beginPath();
			ctx.arc(wallX, hitY, 5, 0, Math.PI * 2);
			ctx.fill();
			ctx.restore();
		}

		function draw() {
			ctx.clearRect(0, 0, width, height);
			ctx.fillStyle = "#1e293b";
			ctx.fillRect(0, 0, width, height);

			const wallX = width / 2;
			const holeTop = holeY - holeSize / 2;
			const holeBottom = holeY + holeSize / 2;

			ctx.fillStyle = "#94a3b8";
			ctx.fillRect(wallX - wallWidth / 2, 0, wallWidth, holeTop);
			ctx.fillRect(
				wallX - wallWidth / 2,
				holeBottom,
				wallWidth,
				height - holeBottom
			);

			ctx.strokeStyle = "#38bdf8";
			ctx.lineWidth = 2;
			ctx.strokeRect(wallX - wallWidth, holeTop, wallWidth * 2, holeSize);

			ctx.strokeStyle = "#475569";
			ctx.lineWidth = 2;
			ctx.setLineDash([6, 6]);
			ctx.strokeRect(1, 1, width - 2, height - 2);
			ctx.setLineDash([]);

			for (const ball of balls) {
				drawTrajectory(ball);
			}

			for (const ball of balls) {
				ctx.beginPath();
				ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
				ctx.fillStyle = ball.color;
				ctx.fill();
			}
		}

		function frame(time) {
			const dt = Math.min((time - lastTime) / 1000, 0.04);
			lastTime = time;

			update(dt);
			draw();
			requestAnimationFrame(frame);
		}

		for (const player of players) {
			setupHoldButton(player);

			player.slider.addEventListener("input", () => {
				updatePlayerUI(player);
			});

			player.slider.addEventListener("wheel", event => {
				event.preventDefault();

				const change = event.deltaY < 0 ? 10 : -10;
				const nextValue = Number(player.slider.value) + change;

				player.slider.value = Math.max(-100, Math.min(100, nextValue));
				updatePlayerUI(player);
			}, { passive: false });
		}

		document.querySelector("#botCheckbox").addEventListener("change", event => {
			if (event.target.checked) {
				setHolding(players[1], false);
			}
		});

		window.addEventListener("keydown", event => {
			if (event.code === "Space") {
				event.preventDefault();
				addBall();
			}
		});

		window.addEventListener("resize", resize);

		resize();

		for (let i = 0; i < 10; i++) {
			addBall();
		}

		for (const player of players) {
			newTask(player);
			updatePlayerUI(player);
		}

		requestAnimationFrame(frame);
	</script>
</body>
</html>
