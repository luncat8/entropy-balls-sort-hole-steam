<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy Balls</title>
<style>
	html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #e5e7eb; font-family: monospace; }
	#app { position: relative; width: 100%; height: 100%; }
	#c { display: block; }
	#topbar, #bottombar { position: absolute; left: 0; right: 0; padding: 6px 10px; font-size: 12px; background: rgba(0,0,0,0.4); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
	#topbar { top: 0; }
	#bottombar { bottom: 0; }
	#settings-panel { position: absolute; top: 40px; right: 10px; width: 280px; max-height: 70vh; overflow: auto; background: rgba(15,23,42,0.95); padding: 10px; border: 1px solid #334155; border-radius: 6px; }
	#settings-panel.hidden { display: none; }
	#task-panel { position: absolute; bottom: 40px; left: 10px; width: 260px; max-height: 30vh; overflow: auto; background: rgba(15,23,42,0.9); padding: 8px; border: 1px solid #334155; border-radius: 6px; font-size: 11px; }
	#settings-panel label { display: block; margin: 6px 0; font-size: 11px; }
	#settings-panel input[type=range] { width: 160px; }
	#settings-panel h3 { margin: 0 0 8px; }
	.title { font-weight: bold; }
	button { background: #1e293b; color: #e5e7eb; border: 1px solid #334155; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-family: monospace; }
	.ebar { width: 60px; height: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
	.ebar > i { display: block; height: 100%; background: #38bdf8; width: 0%; }
	#topbar span { min-width: 40px; display: inline-block; }
	#bottombar #help-text { min-width: 240px; display: inline-block; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="topbar"></div>
  <div id="bottombar"></div>
  <div id="settings-panel"></div>
  <div id="task-panel"></div>
  <div id="quest-goal" hidden></div>
  <fieldset id="preview-mode" style="display:none;"><label><input type="radio" name="preview-mode" value="mean">mean</label><label><input type="radio" name="preview-mode" value="range">range</label><label><input type="radio" name="preview-mode" value="smooth" checked>smooth</label></fieldset>
</div>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/task.js"></script>
<script src="js/goalview.js"></script>
<script src="js/preview.js"></script>
<script src="js/player.js"></script>
<script src="js/bot.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
