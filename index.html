<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy Balls Hole</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #12151b; }
#app { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.draw-options {
	position: fixed;
	top: 12px;
	left: 12px;
	z-index: 1;
	color: #edf0f6;
	font: 13px/1.35 system-ui, sans-serif;
}
.draw-options fieldset {
	margin: 0;
	padding: 8px 12px 10px;
	border: 1px solid #495263;
	border-radius: 8px;
	background: rgba(18, 21, 27, 0.92);
	box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
}
.draw-options legend { padding: 0 4px; color: #c9d1e0; }
.draw-options-group { display: grid; gap: 6px; }
.draw-options-group + .draw-options-group {
	margin-top: 9px;
	padding-top: 8px;
	border-top: 1px solid rgba(73, 82, 99, 0.75);
}
.draw-options-heading {
	color: #9ba6ba;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.05em;
	text-transform: uppercase;
}
.draw-options label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.draw-options input { margin: 0; accent-color: #83b8ff; }
.preview-mode { margin-top: 9px; }
.preview-mode label {
	grid-template-columns: 16px 1fr 34px;
	align-items: center;
}
/* one target, three shapes: an option must look like what it draws, not like a styled swatch */
.target {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 1px;
	box-sizing: border-box;
	overflow: hidden;
	flex: none;
}
.target i {
	display: block;
	flex: none;
	border-radius: 50%;
	box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
}
.target-smooth i { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
.target-empty { background: transparent; }
.preview-mode .preview-sample {
	width: 34px;
	height: 22px;
	border-radius: 4px;
	border: 1px solid rgba(237, 240, 246, 0.25);
}
.preview-mode .target-mean i { width: 16px; height: 16px; }
.preview-mode .target-range i { width: 5px; height: 5px; }
.quest-list {
	position: fixed;
	top: 12px;
	right: 12px;
	z-index: 1;
	width: 268px;
	margin: 0;
	padding: 0;
	list-style: none;
	color: #edf0f6;
	font: 13px/1.35 system-ui, sans-serif;
}
.quest {
	display: grid;
	grid-template-columns: 26px 1fr;
	gap: 9px;
	align-items: center;
	padding: 8px 10px;
	border: 1px solid #495263;
	border-radius: 8px;
	background: rgba(18, 21, 27, 0.92);
	box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
	cursor: pointer;
	touch-action: none;
	user-select: none;
}
.quest + .quest { margin-top: 6px; }
.quest:focus-visible { outline: 2px solid #83b8ff; outline-offset: 2px; }
.quest[hidden] { display: none; }
.quest:active { border-color: #83b8ff; }
.quest-swatch {
	width: 26px;
	height: 26px;
	border-radius: 5px;
	border: 1px solid rgba(237, 240, 246, 0.25);
}
.quest-swatch.target-mean i { width: 20px; height: 20px; }
.quest-swatch.target-range i { width: 4px; height: 4px; }
.quest-body { display: grid; gap: 1px; min-width: 0; }
.quest-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quest-meta { color: #9ba6ba; font-size: 11px; }
.quest-panel {
	position: fixed;
	top: 12px;
	right: 292px;
	z-index: 1;
	width: 236px;
	padding: 10px 12px 12px;
	border: 1px solid #495263;
	border-radius: 8px;
	background: rgba(18, 21, 27, 0.96);
	box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
	color: #edf0f6;
	font: 13px/1.35 system-ui, sans-serif;
}
.quest-panel[hidden] { display: none; }
.quest-panel-swatch {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 2px;
	height: 54px;
	border-radius: 6px;
	border: 1px solid rgba(237, 240, 246, 0.25);
	overflow: hidden;
}
.quest-panel-swatch i {
	display: block;
	flex: none;
	border-radius: 50%;
	box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
}
.quest-panel-swatch.target-mean i { width: 34px; height: 34px; }
.quest-panel-swatch.target-range i { width: 10px; height: 10px; }
.quest-panel-swatch.target-smooth i { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
.quest-goal {
	position: fixed;
	left: 12px;
	bottom: 12px;
	z-index: 1;
	max-width: 60vw;
	padding: 6px 10px;
	border: 1px solid #495263;
	border-radius: 8px;
	background: rgba(18, 21, 27, 0.92);
	box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
	color: #edf0f6;
	font: 12px/1.35 system-ui, sans-serif;
}
.quest-goal[hidden] { display: none; }
.quest-panel-title { margin-top: 8px; font-weight: 600; }
.quest-panel-detail { margin-top: 3px; color: #9ba6ba; font-size: 11px; }
.quest-panel-dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 7px; }
.quest-panel-dots i {
	width: 9px;
	height: 9px;
	border-radius: 50%;
	border: 1px solid rgba(237, 240, 246, 0.35);
}
.quest-panel-dots i.on { background: #83b8ff; border-color: #83b8ff; }
/* under this width the side panel would cover the divider, so the panel moves to the bottom edge */
@media (max-width: 1150px) {
	.draw-options { top: 8px; left: 8px; font-size: 12px; }
	.quest-list { top: 8px; right: 8px; font-size: 12px; width: 200px; }
	.quest-panel { top: auto; bottom: 8px; right: 8px; left: 8px; width: auto; }
	.quest-panel-swatch { height: 40px; }
	.quest-goal { left: 8px; bottom: 8px; max-width: calc(100vw - 16px); }
}
</style>
</head>
<body>
<div id="app">
	<canvas id="canv"></canvas>
</div>
<ul id="task-list" class="quest-list" aria-live="polite"></ul>
<div id="quest-goal" class="quest-goal" hidden aria-live="polite"></div>
<aside id="quest-panel" class="quest-panel" hidden aria-live="polite">
	<div class="quest-panel-swatch"></div>
	<div class="quest-panel-title" data-field="title"></div>
	<div class="quest-panel-detail" data-field="detail"></div>
	<div class="quest-panel-dots" data-field="dots"></div>
</aside>
<aside class="draw-options" aria-label="Drawing options">
	<fieldset>
		<legend>Wall impact cues</legend>
		<div class="draw-options-group">
			<span class="draw-options-heading">Before hit</span>
			<label><input id="draw-predicted-position" type="checkbox" checked> Predicted position</label>
			<label><input id="draw-trajectory-lines" type="checkbox" checked> Trajectory lines</label>
		</div>
		<div class="draw-options-group">
			<span class="draw-options-heading">After hit</span>
			<label><input id="draw-slow-fade-hit-spot" type="checkbox"> Slow fade hit spot</label>
		</div>
		<div class="draw-options-group preview-mode" id="preview-mode">
			<span class="draw-options-heading">Quest target color</span>
			<label><input type="radio" name="preview-mode" value="mean"> A ball of the average color</label>
			<label><input type="radio" name="preview-mode" value="range"> A few balls across the range</label>
			<label><input type="radio" name="preview-mode" value="smooth" checked> A smooth palette rectangle</label>
		</div>
	</fieldset>
</aside>
<script src="color.js"></script>
<script src="simulation.js"></script>
<script src="canvas.js"></script>
<script src="input.js"></script>
<script src="players.js"></script>
<script src="tasks.js"></script>
<script src="quest.js"></script>
<script src="goalview.js"></script>
<script src="preview.js"></script>
<script src="main.js"></script>
</body>
</html>
